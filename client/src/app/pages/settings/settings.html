<div class="page">
  <app-page-header icon="settings" title="Settings"></app-page-header>

  <div class="settings-body">
    <!-- Vertical tab rail -->
    <nav class="settings-tabs">
      @for (tab of availableTabs(); track tab.id) {
        <button
          type="button"
          class="settings-tab"
          [class.active]="activeTab() === tab.id"
          (click)="selectTab(tab.id)"
        >
          <lucide-icon [name]="tab.icon" [size]="15" [strokeWidth]="1.5" />
          <span class="settings-tab__label">{{ tab.label }}</span>
        </button>
      }
    </nav>

    <!-- Tab panels. All sections stay mounted (toggled via [hidden]) so
         in-progress form input is never lost when switching tabs. -->
    <div class="settings-content">
      <app-dashboards-section [hidden]="activeTab() !== 'dashboards'" />
      <app-events-section [hidden]="activeTab() !== 'events'" />
      <app-retention-section [hidden]="activeTab() !== 'retention'" />
      @if (authService.isAdmin()) {
        <app-users-section [hidden]="activeTab() !== 'users'" />
      }
      <app-api-keys-section [hidden]="activeTab() !== 'api-keys'" />
      @if (authService.isAdmin()) {
        <!-- Loaded — code and data — the first time its tab is opened, and kept mounted from
             then on like the sections around it. Until its code is here the tab says so, and
             when the code cannot be fetched (the network, a deploy that replaced the file)
             it says that: an empty panel would say nothing. Both lines belong to the tab,
             so both hide with it. -->
        @defer (when activeTab() === 'ai-mcp') {
          <app-mcp-section [hidden]="activeTab() !== 'ai-mcp'" />
        } @loading {
          <span class="loading-text" [hidden]="activeTab() !== 'ai-mcp'">Loading…</span>
        } @error {
          <span class="section-load-error" role="alert" [hidden]="activeTab() !== 'ai-mcp'">The AI / MCP section could not be loaded: reload the page to try again.</span>
        }
        <app-updates-section [hidden]="activeTab() !== 'updates'" />
      }
    </div>
  </div>
</div>
