<div class="sig-header">
  <span class="sig-title">
    <lucide-icon name="bell" [size]="13" [strokeWidth]="1.8" />
    Signals
  </span>
  <button class="sig-icon-btn" (click)="closed.emit()" title="Close">
    <lucide-icon name="x" [size]="14" [strokeWidth]="1.8" />
  </button>
</div>

<div class="sig-list">

  <!-- ── Firing (log-source) alerts ──────────────────────────────────────── -->
  @if (firing().length) {
    <div class="sig-section-label">
      <lucide-icon name="flame" [size]="12" [strokeWidth]="1.9" />
      Firing
    </div>
    @for (a of firing(); track a.id) {
      <div class="sig-item sig-item--firing" (click)="apply(a.filter)" [title]="a.filter || a.name">
        <div class="sig-dot" [attr.data-sev]="a.severity"></div>
        <div class="sig-info">
          <span class="sig-name">{{ a.name }}</span>
          @if (a.filter) {
            <span class="sig-filter">{{ a.filter }}</span>
          }
        </div>
      </div>
    }
  }

  <!-- ── Search history (shared with the Traces/Metrics panels) ──────────── -->
  <app-search-history scope="logs" (querySelected)="apply($event)" />
</div>
