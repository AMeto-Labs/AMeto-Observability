<div #menu class="prop-menu" [class.floating]="floating()" [style.left.px]="floating() ? left() : null" [style.top.px]="floating() ? top() : null" (click)="$event.stopPropagation()">
  <div class="pm-header mono" [title]="propKey() + ' = ' + propValue()">{{ propKey() }}</div>

  <!-- Copy -->
  <div class="pm-group">
    <div class="pm-section">Copy</div>
    <button class="pm-item" (click)="copyValue.emit()">
      <lucide-icon name="copy" [size]="12" /> Value
    </button>
    <button class="pm-item" (click)="copyKey.emit()">
      <lucide-icon name="copy" [size]="12" /> Key
    </button>
    @if (findable()) {
      <div class="pm-row">
        <lucide-icon name="copy" [size]="12" class="pm-row-icon" />
        <span class="pm-label">Condition</span>
        <button class="pm-op" (click)="copyCondition.emit(false)" title="Copy {{ propKey() }} = this value">=</button>
        <button class="pm-op" (click)="copyCondition.emit(true)"  title="Copy {{ propKey() }} ≠ this value">≠</button>
      </div>
    }
  </div>

  <!-- Find -->
  @if (findable()) {
    <div class="pm-group">
      <div class="pm-section">Find</div>
      <div class="pm-row">
        <span class="pm-label">Search by key</span>
        <button class="pm-op" (click)="search.emit(false)" title="Only entries where {{ propKey() }} equals this value">=</button>
        <button class="pm-op" (click)="search.emit(true)"  title="Only entries where {{ propKey() }} differs">≠</button>
      </div>
      <div class="pm-row">
        <span class="pm-label">And expression</span>
        <button class="pm-op" (click)="andExpr.emit(false)" title="Append AND {{ propKey() }} = …">=</button>
        <button class="pm-op" (click)="andExpr.emit(true)"  title="Append AND {{ propKey() }} ≠ …">≠</button>
      </div>
      <div class="pm-row">
        <span class="pm-label">Or expression</span>
        <button class="pm-op" (click)="orExpr.emit(false)" title="Append OR {{ propKey() }} = …">=</button>
        <button class="pm-op" (click)="orExpr.emit(true)"  title="Append OR {{ propKey() }} ≠ …">≠</button>
      </div>
      @if (wildcard()) {
        <div class="pm-row">
          <span class="pm-label">Any element</span>
          <button class="pm-op" (click)="anyElement.emit(false)" title="Entries where any array element matches">=</button>
          <button class="pm-op" (click)="anyElement.emit(true)"  title="Entries where any array element differs">≠</button>
        </div>
      }
    </div>
  }

  <!-- Seek -->
  @if (seekable()) {
    <div class="pm-group">
      <div class="pm-section">Seek window</div>
      <div class="pm-row">
        <lucide-icon name="clock" [size]="12" class="pm-row-icon" />
        <span class="pm-label">±</span>
        <button class="pm-op pm-op--wide" (click)="seek.emit(5)"  title="5 seconds either side">5 s</button>
        <button class="pm-op pm-op--wide" (click)="seek.emit(15)" title="15 seconds either side">15 s</button>
        <button class="pm-op pm-op--wide" (click)="seek.emit(30)" title="30 seconds either side">30 s</button>
      </div>
    </div>
  }

  <!-- Open -->
  @if (viewable() || crossLabel()) {
    <div class="pm-group">
      <div class="pm-section">Open</div>
      @if (viewable()) {
        <button class="pm-item" (click)="viewValue.emit()">
          <lucide-icon name="maximize-2" [size]="12" /> Full value
        </button>
      }
      @if (crossLabel(); as label) {
        <button class="pm-item" (click)="cross.emit()">
          <lucide-icon name="list" [size]="12" /> {{ label }}
        </button>
      }
    </div>
  }
</div>
