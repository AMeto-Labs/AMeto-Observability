<div class="sh-section-label">
  <lucide-icon name="history" [size]="12" [strokeWidth]="1.9" />
  Search history
</div>

@if (history.pinned().length === 0 && history.recent().length === 0) {
  <div class="sh-empty">
    <lucide-icon name="search" [size]="20" [strokeWidth]="1.5" />
    <span>No searches yet</span>
    <span class="sh-hint">{{ emptyHint() }}</span>
  </div>
} @else {
  @for (q of history.pinned(); track q) {
    <div class="sh-item" (click)="apply(q)" [title]="display()(q)">
      <lucide-icon name="pin" [size]="12" [strokeWidth]="1.8" class="sh-lead sh-lead--pinned" />
      <span class="sh-query">{{ display()(q) }}</span>
      <div class="sh-item-actions">
        <button class="sh-icon-btn" (click)="pin(q, false, $event)" title="Unpin">
          <lucide-icon name="pin-off" [size]="12" [strokeWidth]="1.8" />
        </button>
        <button class="sh-icon-btn danger" (click)="remove(q, $event)" title="Remove">
          <lucide-icon name="x" [size]="12" [strokeWidth]="1.8" />
        </button>
      </div>
    </div>
  }
  @for (q of history.recent(); track q) {
    <div class="sh-item" (click)="apply(q)" [title]="display()(q)">
      <lucide-icon name="clock" [size]="12" [strokeWidth]="1.8" class="sh-lead" />
      <span class="sh-query">{{ display()(q) }}</span>
      <div class="sh-item-actions">
        <button class="sh-icon-btn" (click)="pin(q, true, $event)" title="Pin">
          <lucide-icon name="pin" [size]="12" [strokeWidth]="1.8" />
        </button>
        <button class="sh-icon-btn danger" (click)="remove(q, $event)" title="Remove">
          <lucide-icon name="x" [size]="12" [strokeWidth]="1.8" />
        </button>
      </div>
    </div>
  }
}
