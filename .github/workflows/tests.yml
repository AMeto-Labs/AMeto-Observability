# The suite this repository already has, actually run.
#
# Until this file existed, `.github/workflows/` held only publish-nuget.yml and release.yml, both
# `-c Release`, and neither invoked `dotnet test`. Four review rounds cited "428 tests green" for a
# suite that ran nowhere but one developer's machine — and at least one of those tests is known to
# behave differently under optimisation, so "it passed locally" was not even the same statement as
# "it passes".
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # DEBUG, deliberately, and it is the default for a reason worth stating: `dotnet test` builds
      # Debug, so that is the configuration every contributor runs and the one their green result
      # describes. The memory probes in this suite also depend on it — an optimising JIT drops a
      # local the moment it is dead, so a forced collection inside a probe can reclaim the very
      # allocation the probe exists to see. Those tests skip themselves under Release rather than
      # report a healthy number over defective code; see SpanTraceReadBoundTests.
      # All five test projects are in Ameto.slnx, so this is the whole suite, integration
      # included. It runs once: the integration suite is run three times locally because of a
      # known flake, and a flake that only ever shows up on a developer's third attempt is
      # precisely what CI should be allowed to go red on.
      - name: Test (Debug)
        shell: pwsh
        run: |
          dotnet test -c Debug --nologo -v minimal 2>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A SKIPPED TEST READS AS A PASSING ONE. The memory probes skip themselves under an
          # optimising JIT rather than report a healthy number over defective code, which is the
          # right call and also a quiet one: nothing in a green report distinguishes "the probe
          # ran and the peak was flat" from "the probe declined to run". This job is Debug, so
          # the expected skip count is zero, and anything else means a test stopped running
          # without anyone deciding it should.
          $skipped = (Select-String -Path test-output.txt -Pattern 'Skipped:\s+(\d+)' -AllMatches |
                      ForEach-Object { $_.Matches } |
                      ForEach-Object { [int]$_.Groups[1].Value } |
                      Measure-Object -Sum).Sum
          if ($skipped -gt 0) {
            Write-Host "::error::$skipped test(s) skipped under Debug, where nothing should skip."
            Select-String -Path test-output.txt -Pattern 'Skipped:\s+[1-9]'
            exit 1
          }
          Write-Host "no skipped tests"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
