# The suite this repository already has, actually run.
#
# Until this file existed, `.github/workflows/` held only publish-nuget.yml and release.yml, both
# `-c Release`, and neither invoked `dotnet test`. Four review rounds cited "428 tests green" for a
# suite that ran nowhere but one developer's machine — and at least one of those tests is known to
# behave differently under optimisation, so "it passed locally" was not even the same statement as
# "it passes".
name: tests

on:
  push:
    branches: [main]
  pull_request:

# ONE RUN PER PR REF; THE SUPERSEDED ONE IS CANCELLED.
#
# WHAT THIS BUYS, stated correctly on the second attempt. The first version of this comment blamed
# a flaky CPU-scaling test on runs "competing for the same runner pool" — that is wrong, and worth
# writing down so nobody debugs a timing test from it. Both jobs run on GitHub-hosted runners, so
# every run gets its own ephemeral VM with its own cores; parallel runs share the QUEUE, not the
# processor. The test read one busy thread at 32.7 % on a 4-core box where a lone core is 25 %
# because its own process — the xUnit host, the JIT, the GC — was busy, and it asserted a RATIO,
# which cannot subtract that. It was fixed where it broke, by measuring the increment instead.
#
# What the pile-up demonstrably cost is queue time: three pushes to one branch in quick succession
# left three ~25-minute Windows jobs outstanding, one of which waited 31 minutes to start. This
# holds one runner slot per PR ref instead of N, which is reason enough on its own.
#
# MAIN IS OUT OF THE GROUP ENTIRELY, not merely exempt from cancellation. `cancel-in-progress:
# false` still serialises the group, and GitHub then cancels any PREVIOUSLY PENDING run in it — so
# three pushes to main would have given the middle commit no verdict at all, which is precisely the
# history a bisect needs. Keying main's group by SHA gives every commit its own group and its own
# run, while PR refs keep sharing one and cancelling.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: windows-latest
    # The suite is ~11 minutes when its projects run one after another and ~20 when Storage and
    # Integration overlap on the two cores; the default is six hours. A test that hangs should cost
    # a coffee, not a runner-day. 40, not 30: a hang late in a ~20 minute run needs its 15-minute
    # blame timeout (below) to fire and report before the job limit cancels everything silently.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # DEBUG, deliberately, and it is the default for a reason worth stating: `dotnet test` builds
      # Debug, so that is the configuration every contributor runs and the one their green result
      # describes. The memory probes in this suite also depend on it — an optimising JIT drops a
      # local the moment it is dead, so a forced collection inside a probe can reclaim the very
      # allocation the probe exists to see, and the probe then reports a healthy number over
      # defective code.
      #
      # SIX test projects are in Ameto.slnx, and `dotnet test` at the root runs all of them:
      # Core, Query, Indexing, Storage, Integration — and Ameto.Perf, which is an OutputType=Exe
      # BenchmarkDotNet host that also carries ~53 [Fact]s and takes 2m40s-3m45s of the ~11 minute
      # job. Its probes measure allocation and CPU on a shared two-core runner, so its timings vary
      # by ~40% between runs of identical code; it is in the gate deliberately for now, and if it
      # starts flaking it should be split out rather than retried.
      #
      # It runs once: the integration suite is run three times locally because of a known flake,
      # and a flake that only ever shows up on a developer's third attempt is precisely what CI
      # should be allowed to go red on.
      #
      # A HANG MUST NAME ITS TEST, NOT SPEND THE JOB. Run 35964432043 (PR #84) was cancelled at the
      # 30-minute limit with the integration suite simply silent: `-v minimal` prints nothing for a
      # test that never ends, and a cancelled job keeps no output of the test host. With a hang
      # timeout the blame collector kills a test host that has sat on ONE test for 15 minutes (the
      # timer is per test, not per project), prints "The test running when the crash occurred:
      # <name>", writes a mini dump of the
      # host under that project's TestResults, and the step fails through the exit-code check
      # below with the suite named — well inside the job's budget. The same collector also names
      # the test that was running when a test host crashes outright. The skip guard is unaffected:
      # blame adds "Data collector 'Blame' message" lines, none of which match `Skipped:`.
      #
      # 15, NOT 5: SINGLE TESTS DO TAKE MINUTES HERE. Run 35971819964 killed the Storage host after
      # 5 minutes on SegmentBucketAdversarialProbe.OpenBucketAmplificationConverges — not hung: its
      # dump shows the test thread inside CreateFile (4 000 flushes, each opening files on a runner
      # whose real-time scanning slows file creation) and no Ameto thread waiting on anything. The
      # test takes 41 s on a developer box and fitted inside the 11-13 minute Storage run before.
      - name: Test (Debug)
        shell: pwsh
        run: |
          dotnet test -c Debug --nologo -v minimal --blame-hang-timeout 15m --blame-hang-dump-type mini 2>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # A SKIPPED TEST READS AS A PASSING ONE. Nothing in a green report distinguishes "the
          # test ran and the assertion held" from "the test declined to run". This job is Debug,
          # so the expected skip count is zero, and anything else means a test stopped running
          # without anyone deciding it should.
          #
          # WHAT THIS GUARD CANNOT SEE, stated so nobody trusts it further than it goes: it reads
          # the runner's `Skipped:` tally, so it only catches a test that skips through the
          # framework — Assert.Skip, [SkippableFact], a Skip= on the attribute. A test that
          # self-skips by RETURNING EARLY is reported as Passed, is absent from this tally, and is
          # invisible here. If you add a probe that stands down under some condition, make it skip
          # through xUnit or this gate will not know it went quiet. (The Linux huge-page test still
          # returns early here, by design, on Windows; the backend-linux job below is what holds it
          # to account.)
          #
          # The tally itself must fail closed. Summing zero matches yields $null, and $null -gt 0
          # is false, so a change in the runner's summary format (a move to Microsoft.Testing
          # Platform, say) would retire this check in silence — the exact failure it exists to
          # prevent. Requiring one summary line per test project makes that a red build instead.
          $expectedProjects = 6   # Core, Query, Indexing, Storage, Perf, Integration — see Ameto.slnx
          $summaries = @(Select-String -Path test-output.txt -Pattern 'Skipped:\s+(\d+)' -AllMatches |
                         ForEach-Object { $_.Matches } |
                         ForEach-Object { [int]$_.Groups[1].Value })
          if ($summaries.Count -lt $expectedProjects) {
            Write-Host "::error::parsed $($summaries.Count) test summaries, expected $expectedProjects. Either a project stopped running, or the runner's output format changed and this guard can no longer read it."
            exit 1
          }
          $skipped = ($summaries | Measure-Object -Sum).Sum
          if ($skipped -gt 0) {
            Write-Host "::error::$skipped test(s) skipped under Debug, where nothing should skip."
            Select-String -Path test-output.txt -Pattern 'Skipped:\s+[1-9]'
            exit 1
          }
          Write-Host "no skipped tests across $($summaries.Count) test projects"

      # THE HANG'S EVIDENCE LEAVES WITH THE RUNNER unless it is uploaded. A hang in a class fixture's
      # teardown (a WebApplicationFactory host stopping after its last test) happens after every test
      # has finished, so "the test running when the crash occurred" has nothing to name, and the dump
      # and the blame Sequence file are the only record of which thread waited on what.
      - name: Upload hang and crash evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blame-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence_*.xml
            test-output.txt
          if-no-files-found: ignore
          retention-days: 7

  # THE LINUX INGEST ARENA, ON LINUX.
  #
  # The server runs in Linux containers (install/docker), and on Linux its ingest payload arena is
  # advised MADV_NOHUGEPAGE so transparent huge pages cannot make a 512 MB arena resident. The test
  # that checks the kernel took that advice — On_Linux_the_arena_is_opted_out_of_transparent_huge_pages
  # — runs in the backend job above on Windows, takes its off-Linux branch and passes, so the madvise
  # call, its errno and the smaps check behind it were exercised by no CI run at all.
  #
  # This job runs that test's class, and the span ring's arena facts (its trim gives memory back with
  # madvise(MADV_DONTNEED) on Linux — see the second step), and the span bloom under invariant
  # globalization, the Docker image's mode (the third step), and the WALs' durable upgrade rename and
  # the span WAL's relocation record (the fourth), the log WAL's flush tick (the fifth), the WALs'
  # block reservation (the sixth), and log-merge recovery (the seventh). The whole
  # suite already runs above; this job exists for the code that only does anything on Linux, or only
  # in production's mode, or whose tests were written on Windows' share modes.
  #
  # The THP test stands down by RETURNING EARLY — off Linux, on a kernel without THP, with no smaps
  # to read — and the skip guard above explains why that is invisible: an early return is reported
  # as Passed. AMETO_REQUIRE_THP=1 turns each of those roads into a failure, so a runner image that
  # loses THP turns this job red instead of leaving it green over a check it no longer makes. The
  # grep afterwards covers the road the variable cannot: a filter that matches nothing is not an
  # error to `dotnet test` (it exits 0), so a renamed class would pass here by running no test, and a
  # renamed test method by running only its neighbours.
  backend-linux:
    runs-on: ubuntu-latest
    # Restore, Debug builds of Ameto.Perf and Ameto.Storage.Tests and their references, and a few
    # seconds of tests.
    timeout-minutes: 15
    env:
      AMETO_REQUIRE_THP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the arena's huge-page opt-out (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Perf -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~SlabArenaCommitTests" \
            --logger "console;verbosity=normal" 2>&1 | tee test-output.txt

          for t in On_Linux_the_arena_is_opted_out_of_transparent_huge_pages \
                   A_decommitted_tail_leaves_every_byte_below_it_intact_and_is_usable_again; do
            if ! grep -q "Passed Ameto.Perf.SlabArenaCommitTests.$t" test-output.txt; then
              echo "::error::$t did not run and pass; the filter no longer reaches it."
              exit 1
            fi
          done

      # THE SPAN RING'S IDLE TRIM, ON LINUX. On Linux the trim gives the arena back with
      # madvise(MADV_DONTNEED) on a plain allocation — the path the Linux stand runs — while the
      # backend job above takes Windows' VirtualFree path. A page rounded the wrong way here would
      # silently zero live span payloads, so the ring's arena facts run on the platform they are
      # about. Same guard as above: each named fact must appear as Passed, or the job fails.
      - name: Test the span ring's arena trim (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~SpanRingRawTests" \
            --logger "console;verbosity=normal" 2>&1 | tee ring-output.txt

          for t in A_burst_is_given_back_once_the_ring_is_idle_and_the_ring_still_works \
                   The_trim_never_gives_back_a_chunk_a_span_still_uses \
                   A_trim_under_steady_single_batch_traffic_gives_the_burst_back \
                   A_chunk_released_during_a_trim_goes_back_above_the_given_back_ones \
                   The_drainer_trims_the_arena_once_it_finds_the_ring_idle_after_a_burst \
                   A_producer_that_meets_a_trim_waits_for_it_instead_of_refusing \
                   A_payload_goes_through_the_ring_and_comes_back_byte_for_byte; do
            if ! grep -q "Passed Ameto.Storage.Tests.SpanRingRawTests.$t" ring-output.txt; then
              echo "::error::SpanRingRawTests.$t did not run and pass; the filter no longer reaches it."
              exit 1
            fi
          done

      # THE SPAN BLOOM UNDER THE GLOBALIZATION MODE PRODUCTION RUNS. The Docker image is published
      # with InvariantGlobalization (install/docker/Dockerfile), so its casing is .NET's own Unicode
      # data, while every other CI run is ICU. The bloom's case fold is a table compiled into the
      # binary (SpanBloomFold) precisely so the two cannot disagree; this step is where that table is
      # checked against the runtime's invariant fold (The_embedded_fold_is_the_runtimes_invariant_fold
      # goes red the day a .NET update brings new casing), and where a segment written by an ICU child
      # process is read by an invariant one. AMETO_REQUIRE_INVARIANT_GLOBALIZATION=1 turns "this
      # process is not invariant" into a failure instead of an early return; the grep is the same
      # "did not run and pass" guard as above. PREDEFINED_CULTURES_ONLY=false lets the facts pin
      # ru-KZ / sv-SE, which invariant mode otherwise refuses to construct — BUT UNDER INVARIANT
      # GLOBALIZATION EVERY CULTURE FORMATS LIKE THE INVARIANT ONE, so the ru-KZ / sv-SE rows here
      # assert nothing culture-specific: a decimal comma or a U+2212 minus never appears. They are
      # listed for what they still check (the fold, the segment round trip); the culture half of
      # them runs for real in the Windows (ICU) backend job above.
      - name: Test the span bloom under invariant globalization (Debug)
        shell: bash
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
          DOTNET_SYSTEM_GLOBALIZATION_PREDEFINED_CULTURES_ONLY: 'false'
          AMETO_REQUIRE_INVARIANT_GLOBALIZATION: '1'
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~SpanBloomCanonicalTests" \
            --logger "console;verbosity=normal" 2>&1 | tee bloom-output.txt

          for t in The_embedded_fold_is_the_runtimes_invariant_fold \
                   A_segment_written_under_the_other_globalization_mode_loses_no_row \
                   A_segment_folded_by_another_table_loses_no_row \
                   Every_pair_OrdinalIgnoreCase_calls_equal_hashes_equal \
                   A_literal_and_its_lowercase_probe_the_same_bits \
                   Every_value_hashes_the_same_from_the_writer_and_from_the_query_that_matches_it \
                   A_segment_flushed_under_ru_KZ_answers_in_full_under_another_culture; do
            if ! grep -q "Passed Ameto.Storage.Tests.SpanBloomCanonicalTests.$t" bloom-output.txt; then
              echo "::error::SpanBloomCanonicalTests.$t did not run and pass under invariant globalization."
              exit 1
            fi
          done

      # THE WRITE-AHEAD LOGS' UPGRADE AND RELOCATION, ON LINUX. Both WALs commit a format upgrade with
      # a rename made durable by DurableFile (Ameto.Core): MoveFileEx write-through on Windows, which
      # the backend job above runs, and on Linux File.Move followed by an fsync of the directory —
      # the path the Linux stand and the Docker image take, and one no CI run exercised (#103 moved it
      # to Core from the metric WAL and gave it to the span WAL). The span WAL's v3 facts run here
      # too: the relocation record and its finish at open, which this platform forces to disk with
      # msync rather than FlushViewOfFile, and every kill-matrix row, which reads the log through a
      # second handle while it is mapped — coherent through the page cache here, through the cache
      # manager on Windows. Same guard as above: each named fact must appear as Passed.
      - name: Test the WALs' durable upgrade and the span WAL's relocation (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~DurableFileTests|FullyQualifiedName~SpanWalV3Tests" \
            --logger "console;verbosity=normal" 2>&1 | tee wal-output.txt

          for t in DurableFileTests.The_durable_move_replaces_the_log_and_fails_the_way_the_retry_expects \
                   DurableFileTests.The_durable_move_works_past_max_path \
                   DurableFileTests.Both_write_ahead_logs_upgrade_through_the_durable_move \
                   SpanWalV3Tests.A_v2_log_deep_in_a_long_path_is_upgraded_through_the_durable_move \
                   SpanWalV3Tests.A_v2_log_is_upgraded_to_v3_and_replays_every_span \
                   SpanWalV3Tests.A_process_killed_anywhere_inside_a_commit_replays_every_surviving_span_once \
                   SpanWalV3Tests.The_open_that_finishes_a_relocation_forces_it_to_disk; do
            if ! grep -q "Passed Ameto.Storage.Tests.$t" wal-output.txt; then
              echo "::error::$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done

      # THE LOG WAL'S FLUSH TICK, ON LINUX. A tick writes the appended tail back OFF the appender's
      # lock, and how differs by platform: on Linux it issues no msync at all — a shared mapping's
      # pages are the file's page cache, and the fsync that already ran outside the lock writes them —
      # while the backend job above runs Windows' FlushViewOfFile outside the lock, under the view's
      # read lock that a grow and a dispose wait for. The Linux road is production's (the Docker
      # image, the stands), and no CI run took it. Same guard as above: each named fact must appear
      # as Passed.
      - name: Test the log WAL's flush tick (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~WalFlushTickTests|FullyQualifiedName~WalWriterPathTests" \
            --logger "console;verbosity=normal" 2>&1 | tee walflush-output.txt

          for t in CleanTick_DoesNoIoAtAll \
                   DirtyTick_FlushesTheWrittenRange_NotTheWholeMapping \
                   TickAfterMoreAppends_FlushesAgain_AndOnlyTheNewTail \
                   An_append_goes_through_while_a_tick_writes_the_mapping_back \
                   A_grow_waits_out_a_tick_writing_the_old_view_back \
                   A_dispose_waits_out_a_tick_writing_the_view_back \
                   FailedHandleFlush_IsRetriedByTheNextIdleTick \
                   FlushedEntriesSurviveAndReplay \
                   ReopenedWal_DoesNotReflushWhatIsAlreadyOnDisk \
                   FlushAcrossAGrow_StillReplaysEverything; do
            if ! grep -q "Passed Ameto.Storage.Tests.WalFlushTickTests.$t" walflush-output.txt; then
              echo "::error::WalFlushTickTests.$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done
          # The appender's path (round-3 R3-1): the pool's fsync off its lock (and a dispose closing the
          # pool under it), and a grow's unmap without the view's write-back (munmap here,
          # UnmapViewOfFile on Windows); and the tick's own failures (round 4): the handle of a log a
          # failed grow left unmapped, and a pool claim that fails (named here since round-5 L-20 — the
          # filter ran them, and nothing would have said had it stopped).
          for t in An_append_that_needs_a_new_pool_row_goes_through_while_a_tick_fsyncs_the_pool \
                   A_dispose_while_a_tick_fsyncs_the_pool_is_not_the_ticks_error \
                   A_grow_unmaps_the_old_view_without_writing_it_back \
                   A_tick_flushes_the_handle_of_a_log_a_failed_grow_left_unmapped \
                   A_pool_claim_that_fails_is_retried_and_never_replaces_the_wals_failure; do
            if ! grep -q "Passed Ameto.Storage.Tests.WalWriterPathTests.$t" walflush-output.txt; then
              echo "::error::WalWriterPathTests.$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done

      # THE STARTUP SWEEPS, ON LINUX (round-5 L-20). The sweeps that delete what a gone log leaves —
      # its pool (round-4 L18), its completion marker — and the flush that keeps a marker while its log
      # stays: on Windows a pool outlives its log under a tick's open handle, and the look that says a
      # log is gone (round-5 L-18) reads a file system's answer, which is the platform's. These ran in
      # the Windows job alone. Same guard as above: each named fact must appear as Passed.
      - name: Test the startup sweeps (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~Pool_files_whose_log_is_gone_are_swept_at_the_start|FullyQualifiedName~A_log_the_startup_sweep_cannot_look_at_keeps_its_pool_and_its_marker|FullyQualifiedName~A_wal_whose_delete_failed_and_that_cannot_be_looked_at_keeps_its_marker|FullyQualifiedName~_cannot_open_is_kept_and_its_events_come_back|FullyQualifiedName~whose_marker_the_|FullyQualifiedName~whose_pool_the_startup_replay_cannot_open|FullyQualifiedName~On_linux_a_block_without_a_marker_is_cleaned_up" \
            --logger "console;verbosity=normal" 2>&1 | tee sweep-output.txt

          # And (round 6) the recovery reads and the marker checks that a look or an open the file system
          # refuses must not read as "gone" (R5-M6), and the removal of a marker that is not there, which
          # fsynced the directory here and failed with it (R5-M7's LOW).
          for t in Pool_files_whose_log_is_gone_are_swept_at_the_start \
                   A_log_the_startup_sweep_cannot_look_at_keeps_its_pool_and_its_marker \
                   A_wal_whose_delete_failed_and_that_cannot_be_looked_at_keeps_its_marker \
                   A_wal_the_startup_replay_cannot_open_is_kept_and_its_events_come_back \
                   A_spill_file_the_despill_cannot_open_is_kept_and_its_events_come_back \
                   A_wal_whose_pool_the_startup_replay_cannot_open_keeps_its_templates \
                   A_flushed_wal_whose_marker_the_start_cannot_look_at_is_not_written_twice \
                   A_flushed_spill_file_whose_marker_the_despill_cannot_look_at_is_not_written_twice \
                   On_linux_a_block_without_a_marker_is_cleaned_up_whatever_the_directory_fsync_says; do
            if ! grep -q "Passed Ameto.Storage.Tests.IngestWriteAndSpillTests.$t" sweep-output.txt; then
              echo "::error::IngestWriteAndSpillTests.$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done

      # THE WALS' BLOCKS, RESERVED WHERE THEY ARE SIZED, ON LINUX (round-5 H-F). The log WAL and its
      # spill files, the span WAL (round-6 R5-H1) and the metric WAL are mapped over files sized with
      # SetLength — ftruncate here, which leaves them sparse — and a write through the mapping into a
      # page of a full volume was SIGBUS: the server killed, where NTFS fails the open or the grow with
      # an IOException the engine answers 503 with. FileSpace reserves the blocks (fallocate(2)) at each
      # open and each growth; the On_linux facts read the blocks a log has on disk (stat) against its
      # length, and return early off Linux, which the guard turns into a failure here if the filter
      # stops reaching them. The rest of WalReservationTests, and the upgrade facts, refuse a
      # reservation through FileSpace's seam: the file must be left as the open found it, which is
      # ftruncate and unlink here.
      - name: Test the WALs' block reservation (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~On_linux_a_log_has_its_blocks_from_its_open_and_from_each_grow|FullyQualifiedName~On_linux_the_metric_log_has_its_blocks_from_its_open_and_from_each_growth|FullyQualifiedName~WalReservationTests|FullyQualifiedName~whose_copy_the_volume_cannot_hold" \
            --logger "console;verbosity=normal" 2>&1 | tee reserve-output.txt

          for t in WriteAheadLogTests.On_linux_a_log_has_its_blocks_from_its_open_and_from_each_grow \
                   MetricWalTests.On_linux_the_metric_log_has_its_blocks_from_its_open_and_from_each_growth \
                   WalReservationTests.On_linux_the_span_log_has_its_blocks_from_its_open_and_from_each_growth \
                   WalReservationTests.On_linux_the_span_log_reopened_over_a_sparse_file_has_its_blocks \
                   WalReservationTests.Every_open_of_the_span_log_reserves_its_whole_file \
                   WalReservationTests.A_span_log_growth_reserves_what_it_adds \
                   WalReservationTests.A_span_log_growth_the_volume_cannot_hold_fails_its_append_and_is_undone \
                   WalReservationTests.A_span_log_open_the_volume_cannot_hold_throws_and_removes_the_file_it_created \
                   WalReservationTests.A_span_log_open_the_volume_cannot_hold_leaves_an_existing_log_as_it_found_it \
                   SpanWalV3Tests.A_v2_log_whose_copy_the_volume_cannot_hold_stays_v2_and_loses_nothing \
                   WalReservationTests.On_linux_the_metric_log_reopened_over_a_sparse_file_has_its_blocks \
                   WalReservationTests.On_linux_the_log_reopened_over_a_sparse_file_has_its_blocks \
                   WalReservationTests.Every_open_of_the_metric_log_reserves_its_whole_file \
                   WalReservationTests.A_metric_log_open_the_volume_cannot_hold_throws_and_removes_the_files_it_created \
                   WalReservationTests.A_metric_log_open_the_volume_cannot_hold_leaves_an_existing_log_as_it_found_it \
                   WalReservationTests.Every_open_of_the_log_reserves_its_whole_file \
                   WalReservationTests.A_log_open_the_volume_cannot_hold_leaves_an_existing_log_as_it_found_it \
                   WalReservationTests.A_log_open_the_volume_cannot_hold_throws_and_removes_the_files_it_created \
                   MetricWalV2Tests.A_v1_log_whose_copy_the_volume_cannot_hold_opens_as_v1_and_loses_nothing; do
            if ! grep -q "Passed Ameto.Storage.Tests.$t" reserve-output.txt; then
              echo "::error::$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done

      # LOG-MERGE RECOVERY, ON LINUX. The recovery sweep's verdicts and the pin that keeps a waiting
      # merge's sources out of new merges (#98, #120, #129) are logic that does not depend on the
      # platform, but the roads to them were opened, in their first tests, by Windows share modes
      # (a holder that lets nothing read, move or delete a file), so production's platform ran none
      # of them. The engine's seams (_readMergeManifest, _deleteMergeManifest, _proveMergeOutput,
      # _deleteSegmentFile) stage those refusals on every platform; the facts that still need a real
      # holder are [WindowsFact] and reported skipped here. Same guard as above: each named fact must
      # appear as Passed.
      - name: Test log-merge recovery (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Ameto.Storage.Tests -c Debug --nologo -v minimal \
            --filter "FullyQualifiedName~StreamingMergeCrashSafetyTests" \
            --logger "console;verbosity=normal" 2>&1 | tee merge-output.txt

          for t in APassThatCannotReadTheManifest_KeepsTheWaitingOutputsSourcesOutOfMerges \
                   AManifestTheStartCannotRead_KeepsTheSourcesTheScanRegisteredOutOfMerges \
                   ATornWaitingOutput_DoesNotReportItsMergedSourcesAsLost \
                   ANewerFormatWaitingOutputWhoseRollbackFails_KeepsItsSourcesOutOfMerges \
                   AReplicaSourceTheWaitKeptInService_IsTakenOutByTheCommit \
                   AReplicaPushedAgainWhileItsUnlinkIsParked_IsNotMergedASecondTime \
                   ADifferentSegmentPushedUnderAMergedReplicasKey_StaysInService \
                   AWaitingOutputWhoseSourcesAreGone_LeavesTheStoreDegradedUntilItIsCommitted; do
            if ! grep -q "Passed Ameto.Storage.Tests.StreamingMergeCrashSafetyTests.$t" merge-output.txt; then
              echo "::error::StreamingMergeCrashSafetyTests.$t did not run and pass on Linux; the filter no longer reaches it."
              exit 1
            fi
          done

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
