Ameto:
  NodeId: 0
  DataDirectory: data
  HttpPort: 5341

  # ── URL prefix ───────────────────────────────────────────────────────────────
  # Serve the whole server under a path, for hosting behind a reverse proxy at
  # https://host/ameto. Blank (the default) serves everything at the root.
  #
  # Applied at RUNTIME — the UI's <base href> is rewritten as index.html is served —
  # so one build and one container image work under any prefix. Requires a restart.
  # "ameto", "/ameto" and "/ameto/" all mean the same thing.
  #
  # Two things to know before turning it on:
  #   * The prefix is ADDITIVE, not a boundary. Every path keeps answering at the
  #     root as well, which is what lets the container health check and any agent
  #     already pointed at the bare address keep working. If you need the prefix to
  #     actually restrict access, enforce that at the proxy.
  #   * The OAuth redirect URI moves with it. Re-register
  #     https://<host>/ameto/api/auth/oauth/google/callback with the provider.
  #
  # The proxy must PASS the prefix through — do not strip it. In nginx that means
  # `proxy_pass http://ameto:5341;` with NO trailing slash.
  # BasePath: "/ameto"

  # OTLP over gRPC. 0 = off. 4317 is the OTLP convention.
  #
  # It has to be its own port: gRPC needs HTTP/2, and without TLS there is no ALPN to negotiate
  # it, so a plaintext listener that accepts HTTP/2 accepts nothing else. On the main port that
  # would stop the UI, /api, the live tail and the health check from answering.
  OtlpGrpcPort: 0

  # ── Traces ───────────────────────────────────────────────────────────────────
  Traces:
    # Opening a trace has to find which segment holds it, and a trace id carries no time
    # bounds — so before the trace-id index every segment was consulted, and consulting one
    # meant reading and inflating its whole trace index (38% of the .trc). Measured on 168
    # segments: 9 MB read and 12 MB inflated to return five spans.
    #
    # Segments written from now on are indexed as they are flushed, at no cost worth naming.
    # This setting is only about the segments you ALREADY have:
    #
    #   Idle   (default) one segment at a time with a pause between. A week of hourly
    #          segments finishes in a few minutes and never competes with a query.
    #   Eager  as fast as the disk allows. Choose it if you want the fast path now and have
    #          the headroom — indexing a segment reads that same 38%, once.
    #   Off    leave existing segments alone.
    #
    # No value here can make an answer wrong. An unindexed segment is read exactly the way
    # every segment was read before the index existed; the only difference is speed. An
    # unrecognised value falls back to Idle rather than failing the start.
    IndexBackfill: Idle

  # TLS — leave empty for plain HTTP
  SslCertPath: ""
  SslCertPassword: ""

  # Behind a reverse proxy that terminates TLS (nginx/traefik): trust
  # X-Forwarded-Proto/Host so OAuth redirects and links use the public
  # https scheme. Enable ONLY when the server is reachable exclusively
  # through the proxy (clients could spoof the headers otherwise).
  # TrustForwardedHeaders: true
  # List your proxy IP(s) so ONLY they may set forwarded headers (recommended;
  # empty = trust any source, with a startup warning):
  # KnownProxies: ["127.0.0.1"]

  # ── Sign-in providers ────────────────────────────────────────────────────────
  # Local username/password is on by default. To add "Sign in with Google /
  # Microsoft", set the credentials below (or via env: Ameto__Auth__Google__ClientId
  # etc.) and restart. Redirect URI to register with the provider (https required):
  #   https://<host>/api/auth/oauth/google/callback
  #   https://<host>/api/auth/oauth/microsoft/callback
  # Who may sign in is controlled in Settings → Users: exact-email OAuth users
  # or per-domain rules ("anyone @your-company.com gets role X").
  # Auth:
  #   LocalEnabled: true
  #   AdminPassword: ""        # initial admin password; blank = a random one is
  #                            # generated and logged ONCE at first start (no default creds)
  #   Google:
  #     ClientId: ""
  #     ClientSecret: ""
  #   Microsoft:
  #     ClientId: ""
  #     ClientSecret: ""
  #     TenantId: ""           # REQUIRED: your Entra tenant id. A tenant-agnostic endpoint
  #                            # ("common"/"organizations"/"consumers", or blank) leaves the
  #                            # provider disabled: the email claim would then come from any
  #                            # tenant, including one an attacker registers, and sign-in is
  #                            # matched on that address.
  #     AllowMultiTenant: false # set true only if you really do accept sign-ins from any tenant

  # Flush the hot tier when memory pressure exceeds this percentage. NOTE: without a
  # cgroup limit (always on Windows; in Docker unless you pass --memory / mem_limit)
  # this is measured against the WHOLE MACHINE, so unrelated processes can trip it.
  # The engine additionally requires a tier's worth of reclaimable memory before it
  # acts, so a busy host no longer forces a pointless flush + compacting GC every cycle.
  RamTargetPercent: 75

  # ── Server log file ──────────────────────────────────────────────────────────
  # Running as a Windows Service there is no console, and the Event Log provider
  # enforces its own Warning minimum — so Information diagnostics (the 30-second
  # "MEM ws=… gc_heap=… hot_tier=…" attribution line, flush/merge progress, the
  # flush budgets logged at startup) had no sink at all. They go here instead.
  Logging:
    FileEnabled: true
    FileMinimumLevel: "Information"   # Trace|Debug|Information|Warning|Error|Critical
    FileRetainDays: 7                 # written to {DataDirectory}/logs/ameto-YYYYMMDD.log
                                      # (pruned on the date in the file name, so a gap in
                                      #  uptime does not keep stale files alive)

  HotTier:
    # Maximum size of the in-memory hot tier before it is flushed to disk.
    # This is a REAL bound on native memory: the tier's event capacity is derived
    # from the same chunk geometry (8 MB payload + 1 MB headers per chunk), so a
    # 64 MB tier costs 72 MB resident regardless of how small the events are.
    MaxSizeBytes: 67108864   # 64 MB
    MaxAge: "00:05:00"       # 5 minutes — TimeSpan format (hh:mm:ss)

    # Concurrent cold-segment flushes (index build + compress + write). 0 = auto:
    # the smaller of (cores / 2) and what the 640 MB index-build budget affords —
    # at the default tier that is 3. Raise for more flush throughput at the cost of
    # peak RAM (~175 MB per concurrent flush); lower on memory-constrained hosts.
    #
    # The budget is a TARGET, not a guarantee. One flush must always be able to run,
    # so if a single tier's index build already exceeds the budget (a large
    # MaxSizeBytes), the engine runs above it and logs a warning at startup. The
    # effective ceilings are printed on the "Flush budgets:" line either way.
    FlushConcurrency: 0

  Indexing:
    MaxPropertyFlattenDepth: 5

  # Ingestion size limits (bytes)
  Ingestion:
    MaxBatchBytes: 4194304        # 4 MB  — max POST /api/events body (larger → 413)
    MaxEventPayloadBytes: 65536   # 64 KB — max properties per event (larger events dropped + logged)
    MaxOtlpBatchBytes: 8388608    # 8 MB  — max OTLP /otlp/v1/* body (larger → 413)

    # Payload slab arena — the absorption window when the drainer stalls (slabs, not ring
    # slots, are what a burst runs out of; a pending event holds one slab whatever its size).
    # Left unset it is the larger of 8192 slabs of MaxEventPayloadBytes (one OpenTelemetry
    # collector batch) and 15% of the physical limit, both capped at 512 MB. At the 64 KB
    # default slab that is 512 MB on every host, a 512 MB container included.
    # The arena is reserved, and what it takes is never given back. On Linux that is per
    # touched page, not per slab: a typical small event touches one 4 KB page of its slab,
    # so a full batch of them rests at ~32 MB, and only events near the maximum size approach
    # 512 MB. On Windows it is committed (1 MB chunks) up to the deepest slab ever used,
    # whatever the events weigh: one batch that outruns the drainer by ~8192 events commits
    # ~512 MB even for 300-byte events, and a job object's memory limit counts commit, so
    # under a Windows job or container memory limit set it explicitly. Likewise on a small host
    # that expects large events, or needs a hard ceiling (an explicit value always wins), and
    # accept earlier, counted drops under a burst. Watch ingestArenaResidentBytes (deepest slab
    # x slab size: the commit charge on Windows, an upper bound on resident memory on Linux)
    # and ingestDroppedNoSlab in /api/diagnostics.
    # PayloadPoolBytes: 536870912

  # ── Query ────────────────────────────────────────────────────────────────────
  # Search budgets and the cross-query cache of decoded segment indexes.
  Query:
    # Cache of decoded index sections, charged at each entry's RETAINED size (expanded
    # postings + dictionaries + bloom bits). Unset = min(256 MB, 15% of the managed-heap
    # limit) — in a 512 MB container the GC's heap limit is 384 MB, so ~57 MB. 0 disables
    # the cache entirely (every query re-reads and re-decodes what it consults).
    # For a 512 MB stand an explicit 48 MB is a reasonable floor to pin:
    # IndexCacheBytes: 50331648
    #
    # Drop cached indexes nothing has read for this long. 0 = off, which is how servers
    # behaved before this setting existed: then only budget pressure ever evicts, and a
    # server that answers one wide query and goes quiet keeps those postings for ever.
    # IndexCacheIdleEvict: "00:10:00"
    #
    # Wall-clock budget for one search; 0 or negative removes it.
    Timeout: "00:01:00"
    # Searches at once: 0 = auto (cores, clamped 2-16), negative = unlimited. Past the
    # limit a request is refused quickly (503 + Retry-After) rather than everything crawling.
    MaxConcurrent: 0
    QueueWait: "00:00:05"

  # Per-level default retention (days).
  # These are only used the very first time — after that the values live in SQLite.
  Retention:
    VerboseDays: 3
    DebugDays: 3
    InformationDays: 90
    WarningDays: 90
    ErrorDays: 90
    FatalDays: 90

  # ── Software-update check (Settings → Updates, admin only) ───────────────────
  # One conditional request to the GitHub Releases API per interval; a 304
  # response costs nothing against the rate limit. Disable for air-gapped hosts.
  Updates:
    Enabled: true
    CheckIntervalMinutes: 60   # min 15

  # ── Replication ──────────────────────────────────────────────────────────────
  # Symmetric: each node replicates its own segments to all peers.
  Replication:
    Enabled: true
    Secret: ""             # REQUIRED for multi-node: same value on every peer;
                           # authenticates peer calls. Blank = peer endpoints reject
                           # everything (fail-closed), safe for a single node.
    SeedNodes: []
    LocalAddress: ""       # this node's publicly reachable URL, e.g. "http://node0:5341"
    PushTimeout: "00:01:00"    # per-segment HTTP push timeout
    ProbeInterval: "00:00:10"  # how often to probe peers for liveness

  # ── Secrets at rest ──────────────────────────────────────────────────────────
  # Master key encrypting alert-channel secrets (bot tokens, SMTP passwords). When
  # unset, a key is generated in the data directory (logged once). For production
  # set it out of band and keep it OFF the data volume, so a volume leak can't
  # expose both the ciphertext and its key:
  # MasterKey: ""            # or env AMETO__MasterKey
